name: etl_agent

services:
  postgres:
    image: postgres:17-alpine
    container_name: etl_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ETL_AGENT_POSTGRES_USER:-etl_agent}
      POSTGRES_PASSWORD: ${ETL_AGENT_POSTGRES_PASSWORD:-dev_local_2026}
      POSTGRES_DB: ${ETL_AGENT_POSTGRES_DB:-etl_agent}
      TZ: Asia/Shanghai
    volumes:
      - D:/Documents/Docker/volume/app/etl_agent/pg_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${ETL_AGENT_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ETL_AGENT_POSTGRES_USER:-etl_agent} -d ${ETL_AGENT_POSTGRES_DB:-etl_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: etl_agent_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${ETL_AGENT_REDIS_PASSWORD:-dev_redis_2026}
    volumes:
      - D:/Documents/Docker/volume/app/etl_agent/redis_data:/data
    ports:
      - "${ETL_AGENT_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${ETL_AGENT_REDIS_PASSWORD:-dev_redis_2026} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10