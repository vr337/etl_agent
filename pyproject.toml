[project]
name = "etl_agent"
version = "0.1.0"
description = "生产级 ETL-Agent 数据集成平台"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "alembic",
    "asyncpg",
    "celery[redis]",
    "cryptography",
    "fastapi",
    "httpx",
    "hvac>=2.4.0",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "openpyxl>=3.1.5",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-celery",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-sqlalchemy",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "python-multipart>=0.0.32",
    "redis",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[project.scripts]
etl-agent-api = "etl_agent.main:main"
etl-agent-checkpoint-setup = "etl_agent.checkpoint_setup:main"
etl-agent-scan-credentials = "etl_agent.secrets.expiry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

# B008：Depends() 出现在参数默认值是 FastAPI 依赖注入的惯用写法（ruff 文档对 FastAPI 的推荐处理）
[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

# 驱动/客户端库无类型存根（asyncpg / aiomysql / hvac）；strict 模式下跳过其类型检查
# S4 追加：文件格式适配器依赖的 pyarrow / openpyxl / pdfplumber 同样无存根
# S7 追加：Celery（Worker 应用与任务装饰器）与 PyYAML（占位符契约加载）同样无存根
[[tool.mypy.overrides]]
module = ["asyncpg", "aiomysql", "hvac", "pyarrow.*", "openpyxl.*", "pdfplumber.*", "celery", "celery.*", "yaml"]
ignore_missing_imports = true

# S7 追加：Celery `@app.task` 装饰器与 OTel instrumentor 均无类型标注，
# 其调用点已由运行期行为与测试覆盖，strict 下豁免这两类噪音（不影响业务代码的类型约束）
[[tool.mypy.overrides]]
module = ["etl_agent.worker.*", "etl_agent.observability.otel"]
disable_error_code = ["untyped-decorator", "no-untyped-call"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
