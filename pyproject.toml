[project]
name = "etl_agent"
version = "0.1.0"
description = "生产级 ETL-Agent 数据集成平台"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "asyncpg",
    "celery[redis]",
    "cryptography",
    "fastapi",
    "httpx",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-sqlalchemy",
    "psycopg[binary]>=3.3.6",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "redis",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[project.scripts]
etl-agent-api = "etl_agent.main:main"
etl-agent-checkpoint-setup = "etl_agent.checkpoint_setup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

# B008：Depends() 出现在参数默认值是 FastAPI 依赖注入的惯用写法（ruff 文档对 FastAPI 的推荐处理）
[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
