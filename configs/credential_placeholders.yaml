# HOCON 凭据占位符清单（S5 吸收 6：在 SPEC 契约层正式登记）
#
# 依据：SPEC v1.0.3-Baseline 第 3.2 章 M-F / FR-68（图内只传占位符，运行期变量 Worker 侧物化）
#       SPECv1.0.3-Baseline 第 8 章「安全 · 凭据保护」（模型侧永不可见连接密码）
# 用途：MockProvider / 真实 Provider 生成的 HOCON 一律使用下列占位符；
#       S7 Worker 侧 `credential_materialization` 必须按本清单的变量名注入真实值。
# 约束：占位符**不是凭据**，可以进 Checkpoint / 门禁摘要 / 版本制品；真实值只存在于
#       SecretProvider 与 Worker 运行期环境，绝不进任何持久化正文（FR-67 / AC-02）。
schema_version: 1
registered_at: "2026-10-14"
placeholders:
  - variable: SRC_HOST
    scope: source
    meaning: 来源端主机名
    example: db-primary.internal
  - variable: SRC_PORT
    scope: source
    meaning: 来源端端口
    example: "5432"
  - variable: SRC_DB
    scope: source
    meaning: 来源端库名 / schema
    example: etl_source
  - variable: SRC_USER
    scope: source
    meaning: 来源端用户名
    example: etl_reader
  - variable: SRC_PASSWORD
    scope: source
    meaning: 来源端口令（由 SecretProvider 物化）
    example: <由 SecretProvider 提供>
  - variable: SINK_HOST
    scope: sink
    meaning: 目标端主机名
    example: doris-fe.internal
  - variable: SINK_PORT
    scope: sink
    meaning: 目标端端口
    example: "9030"
  - variable: SINK_DB
    scope: sink
    meaning: 目标端库名 / schema
    example: dw
  - variable: SINK_USER
    scope: sink
    meaning: 目标端用户名
    example: etl_writer
  - variable: SINK_PASSWORD
    scope: sink
    meaning: 目标端口令（由 SecretProvider 物化）
    example: <由 SecretProvider 提供>
  - variable: FILE_ASSET_BASE
    scope: file_source
    meaning: 受管文件资产挂载根目录（S7 只读挂载 /data/file-assets）
    example: /data/file-assets
governance:
  gate_rule: GATE-001（禁明文凭据：${} 占位符放行，字面量拦截）
  gate_004_whitelist_owner: harness 策略包 host_whitelist（S6 起，GATE-014 从策略包读取）
  materialization_owner: S7 Worker credential_materialization（变量名必须与本清单一致）
  not_allowed:
    - 任何 ${} 之外的明文口令字面量
    - 把占位符替换为真实值后再写入 Checkpoint / 制品 / 日志
